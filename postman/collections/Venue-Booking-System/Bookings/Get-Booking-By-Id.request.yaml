$kind: http-request
name: Get Booking By Id
method: GET
url: '{{baseUrl}}/bookings/{{bookingId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response id matches bookingId variable", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(pm.environment.get("bookingId"));
      });

      pm.test("Response has status, venue, booker, purpose, timeslot fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
        pm.expect(json).to.have.property("venue");
        pm.expect(json).to.have.property("booker");
        pm.expect(json).to.have.property("purpose");
        pm.expect(json).to.have.property("timeslot");
      });
