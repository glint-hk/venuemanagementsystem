$kind: http-request
name: Get Utilization Metrics
method: GET
url: '{{baseUrl}}/admin/metrics/utilization'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has utilization data", function () {
        const json = pm.response.json();
        pm.expect(json).to.exist;
        const isArrayOrObject = Array.isArray(json) || (typeof json === "object" && json !== null);
        pm.expect(isArrayOrObject).to.be.true;
      });
