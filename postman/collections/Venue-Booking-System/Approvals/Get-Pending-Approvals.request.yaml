$kind: http-request
name: Get Pending Approvals
method: POST
url: '{{baseUrl}}/bookings/approvals'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
        const json = pm.response.json();
        pm.expect(json).to.be.an("array");
      });

      pm.test("Each item has id, venue, booker, status fields", function () {
        const json = pm.response.json();
        json.forEach(function (item) {
          pm.expect(item).to.have.property("id");
          pm.expect(item).to.have.property("venue");
          pm.expect(item).to.have.property("booker");
          pm.expect(item).to.have.property("status");
        });
      });

      const json = pm.response.json();
      if (json.length > 0) {
        pm.environment.set("pendingBookingId", json[0].id);
      }
