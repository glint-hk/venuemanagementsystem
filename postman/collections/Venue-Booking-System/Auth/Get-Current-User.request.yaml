$kind: http-request
name: Get Current User
method: GET
url: '{{baseUrl}}/auth/me'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has id, email, role fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("email");
        pm.expect(json).to.have.property("role");
      });

      pm.test("role is one of BOOKER, APPROVER, ADMIN", function () {
        const json = pm.response.json();
        pm.expect(["BOOKER", "APPROVER", "ADMIN"]).to.include(json.role);
      });
