$kind: http-request
name: Elevate Role
method: PUT
url: '{{baseUrl}}/auth/roles/elevate'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{targetUserId}}",
      "role": "APPROVER",
      "approverTier": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has updated user with new role", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("user");
        pm.expect(json.user).to.have.property("role");
        pm.expect(json.user.role).to.eql("APPROVER");
      });
